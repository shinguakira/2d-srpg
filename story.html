<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台本 — アマギ戦記</title>
    <!--
      開発用の読み物ページ。dev サーバでだけ出る（vite の既定の入口は index.html
      だけなので、production の束には入らない）。

      canvas の閲覧画面（?dev=story）は本編と同じ吹き出しで再生できるのが取り柄で、
      通しで読むには向かない —— 一行 26 字、右の枠は 440px しかない。こちらは
      逆で、再生はできないが最初から最後まで読める。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #e8ecf5;
        --ink-dim: #93a0bb;
        --ink-faint: #5d6880;
        --ground: #10131c;
        --panel: #171b27;
        --line: #262c3d;
        --gold: #e8c56a;
        --left: #8fc4ff;
        --right: #ffb0a0;
        --warn: #ff8f8f;
        --serif: 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif;
        --sans: 'Noto Sans JP', 'Yu Gothic UI', 'Hiragino Sans', system-ui, sans-serif;
        --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--sans);
        line-height: 1.6;
      }

      /* ------------------------------------------------------------ 骨組み */
      .wrap {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 0;
        align-items: start;
      }

      nav {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 20px 12px 40px 20px;
        border-right: 1px solid var(--line);
        background: #0c0f16;
        font-size: 13px;
      }
      nav h1 {
        font-size: 15px;
        letter-spacing: 0.08em;
        color: var(--gold);
        margin: 0 0 4px;
      }
      nav .sub {
        color: var(--ink-faint);
        font-size: 11px;
        margin-bottom: 14px;
      }
      nav a {
        display: block;
        padding: 3px 8px;
        color: var(--ink-dim);
        text-decoration: none;
        border-radius: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      nav a:hover {
        background: #1b2130;
        color: var(--ink);
      }
      nav a.on {
        color: var(--gold);
        background: #1b2130;
      }

      main {
        padding: 28px 40px 200px;
        max-width: 900px;
      }

      /* ------------------------------------------------------------ 道具箱 */
      .tools {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 0 12px;
        margin-bottom: 8px;
        background: linear-gradient(var(--ground) 78%, transparent);
      }
      input[type='search'] {
        flex: 1 1 240px;
        min-width: 180px;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }
      input[type='search']:focus {
        outline: 2px solid #3c5a90;
        outline-offset: 1px;
      }
      label.toggle {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--ink-dim);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .count {
        color: var(--ink-faint);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      /* ------------------------------------------------------------ 中身 */
      h2 {
        font-size: 22px;
        color: var(--gold);
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        margin: 52px 0 4px;
        scroll-margin-top: 60px;
      }
      h2:first-of-type {
        margin-top: 8px;
      }

      section {
        margin: 26px 0 0;
        scroll-margin-top: 60px;
      }
      section > header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        margin-bottom: 10px;
      }
      section > header .label {
        font-size: 14px;
        font-weight: 700;
        color: #cbd6ee;
      }
      section > header .title {
        font-size: 13px;
        color: var(--ink-dim);
      }
      section > header .id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-faint);
        margin-left: auto;
      }

      .lines {
        border-left: 2px solid var(--line);
        padding-left: 18px;
      }

      /* 台詞。**話者は行の頭に置いて、本文はぶら下げる** —— 誰が喋っているかを
         目で追えるようにするのがこのページの全部 */
      .line {
        display: grid;
        grid-template-columns: 7.5em minmax(0, 1fr);
        gap: 0 14px;
        margin: 0 0 9px;
        font-family: var(--serif);
        font-size: 16.5px;
        line-height: 1.95;
      }
      .who {
        text-align: right;
        font-family: var(--sans);
        font-size: 12.5px;
        font-weight: 500;
        line-height: 2.6;
        color: var(--left);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .line.r .who {
        color: var(--right);
      }
      .line.n {
        grid-template-columns: 7.5em minmax(0, 1fr);
      }
      .line.n .text {
        color: var(--ink-dim);
        font-style: italic;
      }
      .text mark {
        background: #4a3c10;
        color: #ffe08a;
        border-radius: 2px;
      }

      .tag {
        display: none;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-faint);
        margin-left: 8px;
      }
      body.ids .tag {
        display: inline;
      }
      .tag.bad {
        color: var(--warn);
        display: inline;
      }

      .flag {
        font-family: var(--sans);
        font-size: 11px;
        color: var(--warn);
        margin-left: 8px;
      }

      .hidden {
        display: none;
      }
      .empty {
        color: var(--ink-faint);
        padding: 40px 0;
      }

      @media (max-width: 860px) {
        .wrap {
          grid-template-columns: 1fr;
        }
        nav {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        main {
          padding: 16px 18px 120px;
        }
        .line,
        .line.n {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .who {
          text-align: left;
          line-height: 1.6;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <nav id="toc">
        <h1>台本</h1>
        <div class="sub">アマギ戦記 ／ 開発用</div>
      </nav>
      <main>
        <div class="tools">
          <input type="search" id="q" placeholder="本文・話者・台本 id を検索" autocomplete="off" />
          <label class="toggle"><input type="checkbox" id="showIds" /> id を出す</label>
          <span class="count" id="count"></span>
        </div>
        <div id="body"></div>
      </main>
    </div>
    <script type="module" src="/src/storyPage.ts"></script>
  </body>
</html>
