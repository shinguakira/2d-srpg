<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FE風 2D SRPG - 戦闘PoC</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        color: #cfd6e6;
        font-family: 'Segoe UI', 'Yu Gothic UI', 'Hiragino Kaku Gothic ProN', sans-serif;
        overflow: hidden;
      }
      #wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      canvas {
        background: #10131d;
        border: 1px solid #2a3350;
        border-radius: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: calc(100vh - 46px);
      }
      #hint {
        font-size: 12px;
        letter-spacing: 0.02em;
        color: #7f8aa8;
      }
      b {
        color: #b9c6e6;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="960" height="640"></canvas>
      <div id="hint">
        <b>↑↓←→ / クリック</b> カーソル ・ <b>Z / Enter</b> 決定 ・ <b>X / 右クリック</b> キャンセル ・ <b>T</b> 敵の攻撃範囲 ・
        <b>E</b> ターン終了 ・ <b>R</b> リスタート
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
