<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>FE風 2D SRPG - 戦闘PoC</title>
    <!--
      GBA の FE の文字は 16px のビットマップフォント一種類。DotGothic16 は
      その時代の日本語ドットゴシックなので、画面の字がいちばん近くなる。
      読み込めなければ Yu Gothic UI に落ちる（render/text.ts の並び）。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        color: #cfd6e6;
        font-family: 'Segoe UI', 'Yu Gothic UI', 'Hiragino Kaku Gothic ProN', sans-serif;
        overflow: hidden;
        /* 指でめくれない。ゲーム側がスクロールもズームも自前で持つ */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /*
        canvas は viewport の中央に固定して、大きさと回転は viewport.ts が入れる。
        flex で並べると縦持ちの 90 度回転が中央からずれるので、絶対配置にしてある。
      */
      canvas {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        transform-origin: center;
        background: #10131d;
        image-rendering: pixelated;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: #7f8aa8;
        pointer-events: none;
      }
      /* 指のときは画面の中にボタンが出るので、キーボードの案内は邪魔にしかならない */
      @media (pointer: coarse) {
        #hint {
          display: none;
        }
      }
      b {
        color: #b9c6e6;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="640"></canvas>
    <div id="hint">
      <b>↑↓←→ / クリック</b> カーソル ・ <b>Z / Enter</b> 決定 ・ <b>X / 右クリック</b> キャンセル ・ <b>R</b> ユニット詳細 ・
      <b>E</b> ターン終了 ・ <b>Shift+R</b> リスタート
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
